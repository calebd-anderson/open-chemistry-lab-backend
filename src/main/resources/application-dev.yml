# ============================================================================
# DEVELOPMENT ENVIRONMENT CONFIGURATION
# ============================================================================
# This file contains development defaults that are:
#   - SAFE to commit to git (no sensitive data)
#   - REASONABLE for local development without local overrides
#   - MERGEABLE from main branch (shared with team)
#
# For developer-specific changes (ports, local URLs, etc.):
#   - Create/edit: src/main/resources/application-local.yml
#   - This file is in .gitignore and won't be committed
# ============================================================================

jwt:
  secret: "${JWT_SECRET:dev-secret-key-unsafe-only-for-dev}"

spring:
  mongodb:
    # Default local MongoDB for development
    uri: mongodb://localhost:27017
    database: chem-lab-dev
  data:
    mongodb:
      # Enable auto-indexing during development
      auto-index-creation: true
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: "INFO"
    org.springframework.web: "DEBUG"
    chemlab: "DEBUG"
#  pattern:
#    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

#server:
#  port: 8080

# Development-friendly CORS settings
web:
  cors:
    allowed-origins:
      - "http://localhost:4200"        # Angular dev server
      - "http://localhost:3000"        # Alternative frontend
      - "http://127.0.0.1:4200"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed-headers:
      - "Origin"
      - "Access-Control-Allow-Origin"
      - "Content-Type"
      - "Accept"
      - "Jwt-Token"
      - "Authorization"
      - "X-Requested-With"
      - "Access-Control-Request-Method"
      - "Access-Control-Request-Headers"
    expose-headers:
      - "Origin"
      - "Content-Type"
      - "Accept"
      - "Jwt-Token"
      - "Authorization"
      - "Access-Control-Allow-Origin"
      - "Access-Control-Allow-Credentials"
    allow-credentials: true
    max-age: 3600

# Development-specific settings
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,loggers"
  endpoint:
    health:
      show-details: always
