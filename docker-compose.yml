services:
  backend:
    build:
      context: ./services/backend-java
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PYTHON_WORKER_URL=http://python-worker:8000

  python-worker:
    build:
      context: ./services/worker-python
      dockerfile: Dockerfile
    ports:
      - "8000:8000"