[project]
name = "worker-python"
version = "0.1.0"
description = "Background worker service for the chemistry application"
readme = "README.md"
authors = [
    { name = "Caleb Anderson", email = "2682726+calebd-anderson@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "rdkit>=2026.3.6",
]

# [project.urls]
# Repository = "https://github.com/..."

[tool.fastapi]
entrypoint = "worker_python.main:app"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.0.0",
    "ruff>=0.12.0",
]
